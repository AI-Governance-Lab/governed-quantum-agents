    function ConvergenceChart({ history, metricName, unit }) {
      if (!history || history.length < 2) return null;
      const minVal = Math.min(...history);
      const maxVal = Math.max(...history);
      const span = (maxVal - minVal) || 1;
      const width = 520, height = 170, padX = 42, padY = 24;
      const pts = history.map((v, i) => {
        const x = padX + (i / (history.length - 1)) * (width - padX * 2);
        const y = height - padY - ((v - minVal) / span) * (height - padY * 2);
        return `${x},${y}`;
      }).join(" ");

      return (
        <div className="glass-card rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
              Variational Convergence Trajectory — {metricName || "Objective"}
            </span>
            <span className="text-xs font-mono text-emerald-400">
              Final: {history[history.length - 1]} {unit || ""}
            </span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-40 overflow-visible">
            <line x1={padX} y1={padY} x2={width - padX} y2={padY} stroke="#1e293b" strokeDasharray="4" />
            <line x1={padX} y1={height - padY} x2={width - padX} y2={height - padY} stroke="#334155" />
            <polyline fill="none" stroke="#06b6d4" strokeWidth="3" points={pts} />
            {history.map((v, i) => {
              const x = padX + (i / (history.length - 1)) * (width - padX * 2);
              const y = height - padY - ((v - minVal) / span) * (height - padY * 2);
              return (
                <g key={i}>
                  <circle cx={x} cy={y} r="4" fill="#22d3ee" />
                  {(i === 0 || i === history.length - 1 || i === Math.floor(history.length / 2)) && (
                    <text x={x} y={y - 8} textAnchor="middle" fill="#94a3b8" fontSize="10">{v}</text>
                  )}
                </g>
              );
            })}
          </svg>
          <div className="flex justify-between text-[11px] text-slate-400 mt-1">
            <span>Iteration 1 (Initial State: {history[0]} {unit})</span>
            <span>Converged ({history.length} Hybrid Iterations)</span>
          </div>
        </div>
      );
    }

          },
          variational_metrics: {

            optimizer: "COBYLA / Parameter-Shift Hybrid",

        interpretation: {

        const nextHistory = [...chatMessages, { role: "user", content: q }];
        setChatMessages(nextHistory);
        setChatInput("");
        setChatLoading(true);
        setChatElapsed(0);
        setActiveTab("chat");
        const cStart = Date.now();
        const cTimer = setInterval(() => {
          setChatElapsed(((Date.now() - cStart) / 1000).toFixed(1));
        }, 100);
        try {
          const res = await fetch("/api/v1/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: q,
              history: nextHistory,
              context: result,
              model: model || null
            })
          });

          clearInterval(cTimer);
          setChatMessages([
            ...nextHistory,
            { role: "assistant", content: data.answer || "No response received.", model: data.model, source: data.source }
          ]);
        } catch (err) {
          clearInterval(cTimer);
          setChatMessages([
            ...nextHistory,
            { role: "assistant", content: "Could not reach Venus AI Copilot. Please check container status." }
          ]);
        } finally {
          setChatLoading(false);
        }
      };

      const fetchMemoryAndHealth = async () => {
        try {
          const [hRes, mRes] = await Promise.all([
            fetch("/health").then(r => r.json()),
            fetch("/api/v1/memory?limit=12").then(r => r.json())

          if (mRes && mRes.records) setMemoryList(mRes.records);
        } catch (e) {
          console.error(e);
        }
      };

      const runDiscovery = async (customPrompt = prompt, customFw = framework) => {
        setLoading(true);
        setActiveStep(1);
        setElapsedSec(0);
        const startTime = Date.now();
        const timer = setInterval(() => {
          const sec = (Date.now() - startTime) / 1000;
          setElapsedSec(sec.toFixed(1));
          if (sec < 1.2) setActiveStep(1);
          else if (sec < 3.0) setActiveStep(2);
          else if (sec < 5.5) setActiveStep(3);
          else if (sec < 7.5) setActiveStep(4);
          else if (sec < 10.5) setActiveStep(5);
          else setActiveStep(6);

          const res = await fetch("/api/v1/solve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              problem_description: customPrompt,
              framework: customFw,
              override_model: model || null,
              shots: Number(shots),
              noise_level: noisyMode ? 0.03 : 0.0

          clearInterval(timer);
          const totalSec = ((Date.now() - startTime) / 1000).toFixed(1);

          setLastExecutedPrompt(customPrompt);
          setActiveStep(6);

          const enc = data?.encoded_problem || {};
          const aud = data?.governance_audit || {};

            {
              role: "assistant",
              model: model || "gemini-4-argon",
              source: "litellm-gateway",
              content: `✅ Ready to discuss your latest execution!\n\n• Executed Command: "${customPrompt}"\n• Selected Algorithm: ${data?.selected_algorithm || "Quantum"} (${customFw.toUpperCase()})\n• Winning Quantum State: |${ex.dominant_state || "01"}⟩ (${((ex.dominant_probability || 0) * 100).toFixed(1)}% across ${ex.repetitions || shots} shots)\n• Variables Mapped: ${(enc.variables || []).join(", ")}\n• Governance Audit: ${Math.round((aud.score || 0.96) * 100)}/100 (${aud.approved !== false ? "APPROVED" : "FLAGGED"})\n\nClick any of the tailored question ideas above or type your own question below!`

          clearInterval(timer);
          console.error(err);
        } finally {
          setLoading(false);
        }

        fetchMemoryAndHealth();
      }, []);

      const varMetrics = execSummary.variational_metrics || {};
      const audit = (result && result.governance_audit) || {};

      const bitstrings = Object.entries(execSummary.bitstring_counts || {}).sort((a, b) => b[1] - a[1]);

          </section>

          {/* Live Activity & Non-Blocking Progress Banner */}
          {loading ? (
            <section className="glass rounded-2xl p-4 border border-cyan-400/60 bg-cyan-950/30 space-y-3 glow-cyan">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-400 flex items-center justify-center animate-spin text-base">
                    ⚛️
                  </div>
                  <div>
                    <div className="text-xs md:text-sm font-bold text-white flex items-center gap-2">
                      <span>Stage 0{activeStep}/06 Active:</span>

                    Variables: {(encoded.variables || []).join(", ")}
                  </span>
                </div>
              </div>
              {/* Dual Prompt Categories: 1. General Framework Q&A  2. Last-Run Analysis */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="glass-card rounded-xl p-3.5 space-y-2">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-400">
                    🌐 Ask About the Venus Framework & Capabilities (General Q&A)
                  </div>
                  <div className="space-y-1.5">
                    {[
                      "What can the Venus Governed Quantum Agents framework do for an enterprise?",
                      "Explain Hardware Mode (Ideal Simulator vs. NISQ Noise) and Shots in simple words",
                      "Which quantum algorithms (VQE, QAOA, Grover, QSVM) and business use cases are supported?",
                      "How does the AI Governance & independent LLM-as-Judge architecture prevent hallucinations?"
                    ].map((q, i) => (
                      <button
                        key={i}
                        onClick={() => askCopilot(q)}
                        disabled={chatLoading}
                        className="w-full text-left px-3 py-2 rounded-lg text-xs bg-slate-900/90 hover:bg-emerald-950/50 text-slate-200 hover:text-emerald-300 border border-slate-800 hover:border-emerald-500/40 transition flex items-start gap-2"
                      >
                        <span className="text-emerald-400 font-bold">🌐</span>
                        <span>{q}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="glass-card rounded-xl p-3.5 space-y-2">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-cyan-400">
                    🔬 Ask About Your Last Executed {result?.selected_algorithm || "Quantum"} Run
                  </div>
                  <div className="space-y-1.5">
                    {[
                      `Explain in simple, normal words what state |${execSummary.dominant_state || "01"}⟩ at ${((execSummary.dominant_probability || 0) * 100).toFixed(1)}% means for this problem`,
                      `What do the variables (${(encoded.variables || ["var_1", "var_2"]).join(", ")}) mean and what business action should we take?`,
                      `Why did the independent LLM-as-Judge give this run ${Math.round((audit.score || 0.96) * 100)}/100 and what are the caveats?`,
                      `Explain the ${telemetry.num_qubits || 2}-qubit circuit gates and depth=${telemetry.circuit_depth || 6} step by step for a beginner`
                    ].map((q, i) => (
                      <button
                        key={i}
                        onClick={() => askCopilot(q)}
                        disabled={chatLoading}
                        className="w-full text-left px-3 py-2 rounded-lg text-xs bg-slate-900/90 hover:bg-cyan-950/60 text-slate-200 hover:text-cyan-300 border border-slate-800 hover:border-cyan-500/40 transition flex items-start gap-2"
                      >
                        <span className="text-cyan-400 font-bold">✨</span>
                        <span>{q}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Chat Messages Area */}
              <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-4 h-80 overflow-y-auto space-y-3">
                {chatMessages.length === 0 && (
                  <div className="text-center text-slate-400 text-xs py-14 space-y-2">
                    <div className="text-2xl">⚛️🤖</div>
                    <div className="font-semibold text-slate-200">Welcome to Venus Quantum AI</div>
                    <div>Ask any general question about what this framework can do (left) or analyze your active {result?.selected_algorithm || "VQE"} simulation (right).</div>
                  </div>
                )}
                {chatMessages.map((msg, i) => (
                  <div key={i} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`max-w-3xl rounded-2xl px-4 py-3 text-xs md:text-sm leading-relaxed whitespace-pre-wrap ${
                      msg.role === "user"
                        ? "bg-cyan-600 text-white"
                        : "bg-slate-900 border border-slate-700 text-slate-100"
                    }`}>
                      {msg.role === "assistant" && (
                        <div className="text-[10px] font-mono text-cyan-400 mb-1">
                          Venus Quantum AI • {msg.model || "gemini-4-argon"} ({msg.source || "litellm-gateway"})
                        </div>
                      )}
                      {msg.content}
                    </div>
                  </div>
                ))}
                {chatLoading && (
                  <div className="p-3 rounded-xl bg-cyan-950/40 border border-cyan-500/40 text-xs text-cyan-300 flex items-center justify-between">
                    <span className="animate-pulse font-semibold">
                      🧠 Venus Quantum AI ({model || "gemini-4-argon"}) is formulating a plain-English response...
                    </span>
                    <span className="font-mono font-bold">⏱️ {chatElapsed}s</span>
                  </div>
                )}
              </div>

              {/* Chat Input Bar */}
              <div className="flex gap-2">
                <input
                  type="text"
                  value={chatInput}
                  onChange={e => setChatInput(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") askCopilot(chatInput); }}
                  placeholder="Ask a follow-up question about the quantum state, circuit gates, energy convergence, or governance audit..."
                  className="flex-1 bg-slate-900 border border-slate-700 focus:border-cyan-400 rounded-xl px-4 py-2.5 text-sm text-white outline-none"
                />
                <button
                  onClick={() => askCopilot(chatInput)}
                  disabled={chatLoading || !chatInput.trim()}
                  className="px-5 py-2.5 rounded-xl font-semibold text-xs md:text-sm bg-gradient-to-r from-cyan-500 to-blue-600 text-white disabled:opacity-50"
                >
                  Send →
                </button>
              </div>
            </div>
          )}
          {activeTab === "quantum" && (
            <div className="space-y-5">
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Logical Qubits (n)</div>
                  <div className="text-xl font-bold text-cyan-400">{telemetry.num_qubits || 2} Qubits</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Circuit Depth (d)</div>
                  <div className="text-xl font-bold text-white">{telemetry.circuit_depth || 6} Layers</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">1Q / 2Q Entangling Gates</div>
                  <div className="text-xl font-bold text-emerald-400">
                    {gateCounts.single_qubit_gates || 4} / {gateCounts.two_qubit_gates || 2}
                  </div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Shannon Entropy (H)</div>
                  <div className="text-xl font-bold text-white">{execSummary.shannon_entropy_bits ?? 0.42} bits</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Optimizer / Precision</div>
                  <div className="text-xs font-bold text-cyan-300 truncate mt-1">{varMetrics.optimizer || "Optimal Quantum Oracle"}</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Noise Model</div>
                  <div className="text-xs font-bold text-amber-300 truncate mt-1">{telemetry.noise_model || "Ideal Simulator"}</div>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div className="glass rounded-2xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
                      Eigenstate Probability Distribution ({execSummary.repetitions || shots} Shots)
                    </h4>
                    <span className="text-xs font-mono text-slate-400">Peak: |{execSummary.dominant_state}⟩</span>
                  </div>
                  <div className="space-y-2.5 pt-1">
                    {bitstrings.map(([state, count]) => {
                      const pct = ((count / (execSummary.repetitions || shots)) * 100).toFixed(1);
                      return (
                        <div key={state} className="space-y-1">
                          <div className="flex justify-between text-xs font-mono">
                            <span className="text-cyan-300 font-bold">|{state}⟩</span>
                            <span className="text-slate-300">{count} shots ({pct}%)</span>
                          </div>
                          <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                            <div className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full" style={{ width: `${Math.max(2, pct)}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <ConvergenceChart
                  history={varMetrics.convergence_history || [-1.11, -1.52, -1.78, -1.857]}
                  metricName={varMetrics.metric_name}
                  unit={varMetrics.unit}
                />
              </div>
              <div className="glass rounded-2xl p-5 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex gap-2">
                    <button
                      onClick={() => setCodeTab("diagram")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${codeTab === "diagram" ? "bg-cyan-500 text-slate-950" : "glass-card text-slate-300"}`}
                    >
                      Synthesized Quantum Circuit Diagram
                    </button>
                    <button
                      onClick={() => setCodeTab("qasm")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${codeTab === "qasm" ? "bg-cyan-500 text-slate-950" : "glass-card text-slate-300"}`}
                    >
                      OpenQASM 2.0 Hardware IR
                    </button>
                  </div>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(codeTab === "diagram" ? (result?.circuit || "") : (telemetry.openqasm || ""));
                      setCopied(true);
                      setTimeout(() => setCopied(false), 1800);
                    }}
                    className="px-3 py-1 rounded-lg text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700"
                  >
                    {copied ? "✓ Copied" : "Copy Code"}
                  </button>
                </div>
                <pre className="bg-slate-950/90 border border-slate-800 rounded-xl p-4 text-xs font-mono text-cyan-300 overflow-x-auto leading-relaxed">
                  {codeTab === "diagram" ? (result?.circuit || "Synthesizing quantum circuit...") : (telemetry.openqasm || "OPENQASM 2.0;")}
                </pre>
              </div>
            </div>
          )}

          {activeTab === "memory" && (
            <div className="glass rounded-2xl p-5 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
                  Persistent Audited Discovery Memory (Kubernetes PVC / Local Store)
                </h3>
                <span className="text-xs text-slate-400">{memoryList.length} Governance-Approved Records</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {memoryList.map((rec, idx) => (
                  <div key={idx} className="glass-card rounded-xl p-4 space-y-2 hover:border-cyan-500/40 transition">
                    <div className="flex items-center justify-between text-xs">
                      <span className="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold">
                        {rec.data?.algorithm_name || "Quantum"}
                      </span>
                      <span className="text-slate-400 font-mono text-[11px]">{rec.timestamp}</span>
                    </div>
                    <div className="text-sm font-semibold text-white">{rec.goal}</div>
                    <div className="text-xs text-slate-400 line-clamp-2">
                      {rec.data?.interpretation?.interpretation || "Verified quantum discovery record."}
                    </div>
                    <button
                      onClick={() => { setPrompt(rec.goal); setActiveTab("executive"); runDiscovery(rec.goal, framework); }}
                      className="text-xs text-cyan-400 hover:text-cyan-300 font-semibold pt-1"
                    >
                      ↻ Re-run this Discovery in Workbench →
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);







  </script>
</body>
</html>
