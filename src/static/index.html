    function CollapsibleChatSection({ title, borderColor, titleColor, previewText, isOpen, onToggle, onFocusTrack, isFocusedTrack, children }) {
      const shortPreview = (previewText || "").replace(/\s+/g, " ").trim().slice(0, 120);
      return (
        <div

              {title} {isFocusedTrack ? " • 🎯 ACTIVE CONTEXT" : ""}
            </span>
            <div className="flex items-center gap-1.5" onClick={e => e.stopPropagation()}>
              {!isFocusedTrack && onFocusTrack && (
                <button

                  className="px-2 py-0.5 rounded bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/50 text-[10px] font-semibold text-cyan-200"

                className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[10px] font-mono text-cyan-200 shrink-0"
              >
                {isOpen ? "− Collapse" : "+ Extend"}
              </button>
            </div>
          </div>
          {!isOpen ? (
            <p className="text-xs text-slate-400 truncate">
              {shortPreview}{shortPreview.length >= 120 ? "..." : ""} <span className="text-cyan-400 font-semibold ml-1">[Click to extend]</span>

          ) : (

    function ConvergenceChart({ history, metricName, unit }) {
      if (!history || history.length < 2) return null;
      const minVal = Math.min(...history);
      const maxVal = Math.max(...history);
      const span = (maxVal - minVal) || 1;
      const width = 520, height = 170, padX = 42, padY = 24;
      const pts = history.map((v, i) => {
        const x = padX + (i / (history.length - 1)) * (width - padX * 2);
        const y = height - padY - ((v - minVal) / span) * (height - padY * 2);
        return `${x},${y}`;
      }).join(" ");

      return (
        <div className="glass-card rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
              Variational Convergence Trajectory — {metricName || "Objective"}
            </span>
            <span className="text-xs font-mono text-emerald-400">
              Final: {history[history.length - 1]} {unit || ""}
            </span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-40 overflow-visible">
            <line x1={padX} y1={padY} x2={width - padX} y2={padY} stroke="#1e293b" strokeDasharray="4" />
            <line x1={padX} y1={height - padY} x2={width - padX} y2={height - padY} stroke="#334155" />
            <polyline fill="none" stroke="#06b6d4" strokeWidth="3" points={pts} />
            {history.map((v, i) => {
              const x = padX + (i / (history.length - 1)) * (width - padX * 2);
              const y = height - padY - ((v - minVal) / span) * (height - padY * 2);
              return (
                <g key={i}>
                  <circle cx={x} cy={y} r="4" fill="#22d3ee" />
                  {(i === 0 || i === history.length - 1 || i === Math.floor(history.length / 2)) && (
                    <text x={x} y={y - 8} textAnchor="middle" fill="#94a3b8" fontSize="10">{v}</text>
                  )}
                </g>
              );
            })}
          </svg>
          <div className="flex justify-between text-[11px] text-slate-400 mt-1">
            <span>Iteration 1 (Initial State: {history[0]} {unit})</span>
            <span>Converged ({history.length} Hybrid Iterations)</span>
          </div>
        </div>
      );
    }

    function VenusTurnBubble({ msg, idx, personaMode, onSelectContextTrack, askCopilot, disabled }) {
      const effectiveMode = msg.locked_track || personaMode;
      const [openSections, setOpenSections] = useState({
        plain: effectiveMode === "plain",

      const toggleSec = (key) => setOpenSections(prev => ({ ...prev, [key]: !prev[key] }));
      const allOpen = openSections.plain && openSections.sci && openSections.steps;
      const toggleAll = () => setOpenSections({ plain: !allOpen, sci: !allOpen, steps: !allOpen });

      const plainText = msg.plain_language_summary || msg.content || "";
      const sciText = msg.scientific_deep_dive || "";
      const stepsList = msg.step_by_step_guide || [];
      const followups = msg.suggested_followups || [];

        <div className="flex items-start gap-3">

              </CollapsibleChatSection>

            {(personaMode === "dual" || personaMode === "steps") && stepsList.length > 0 && (

                        {(((audit.score || 0.96) * 100) - govAnalytics.overall_average_score_pct).toFixed(1)}% vs overall mean
                      </div>
                    </div>
                    <div className="glass-card p-3.5 rounded-xl border-l-4 border-amber-400">
                      <div className="text-slate-400">Score Range (Min – Max)</div>
                      <div className="text-xl font-extrabold font-mono text-amber-300">
                        {govAnalytics.min_score_pct}% – {govAnalytics.max_score_pct}%
                      </div>
                      <div className="text-[11px] text-slate-400">Zero drift outside GxP bounds</div>
                    </div>
                    <div className="glass-card p-3.5 rounded-xl border-l-4 border-cyan-400">
                      <div className="text-slate-400">Autonomous Approval Rate</div>
                      <div className="text-2xl font-extrabold font-mono text-cyan-300">{govAnalytics.approval_rate_pct}%</div>
                      <div className="text-[11px] text-slate-400">Persisted on Kubernetes PVC</div>
                    </div>
                  </div>

                  {/* Grouped Averages Breakdown */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    {(groupByMode === "algorithm"
                      ? govAnalytics.grouped_by_algorithm
                      : groupByMode === "framework"
                      ? govAnalytics.grouped_by_framework
                      : govAnalytics.grouped_by_domain
                    ).map((grp, gIdx) => (
                      <div key={gIdx} className="glass-card p-4 rounded-xl space-y-2 border border-purple-500/20">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-white text-sm">{grp.group}</span>
                          <span className="px-2 py-0.5 rounded bg-purple-500/20 text-purple-200 font-mono">{grp.count} run(s)</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <span className="text-slate-400">Group Average Score:</span>
                          <span className="text-lg font-extrabold font-mono text-emerald-300">{grp.avg_score_pct}%</span>
                        </div>
                        <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-violet-500 to-emerald-400" style={{ width: `${grp.avg_score_pct}%` }} />
                        </div>
                        <div className="text-[11px] text-slate-400 font-mono flex justify-between">
                          <span>Min: {grp.min_score_pct}%</span>
                          <span>Max: {grp.max_score_pct}%</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Historical Questions Asked & Judge Scores Log */}
                  <div className="space-y-2">
                    <div className="text-xs font-bold uppercase tracking-wider text-purple-300">
                      📜 History of What We Asked & Individual LLM-as-Judge Scores
                    </div>
                    <div className="max-h-64 overflow-y-auto space-y-2 pr-1">
                      {(govAnalytics.history_log || []).map((item, hIdx) => (
                        <div key={hIdx} className="glass-card p-3 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-2 text-xs">
                          <div className="space-y-0.5 min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded bg-slate-800 text-amber-300 font-mono font-bold">#{item.run_index}</span>
                              <span className="px-2 py-0.5 rounded bg-purple-500/20 text-purple-200 font-mono">{item.algorithm} • {item.framework}</span>
                              <span className="text-slate-400 font-mono text-[11px]">{item.timestamp}</span>
                            </div>
                            <div className="text-white font-medium truncate">"{item.question_or_goal}"</div>
                          </div>
                          <div className="flex items-center gap-2 shrink-0">
                            <span className="px-2.5 py-1 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 font-mono font-bold">
                              Score: {item.score_pct}% ({item.delta_vs_avg_pct >= 0 ? `+${item.delta_vs_avg_pct}` : item.delta_vs_avg_pct}% vs avg)
                            </span>
                            <button
                              onClick={() => askCopilot(`Explain why historical run #${item.run_index} ("${item.question_or_goal}") received a Judge score of ${item.score_pct}% and how it compares to our ${govAnalytics.overall_average_score_pct}% average.`)}
                              className="px-2.5 py-1 rounded-lg bg-purple-500/20 hover:bg-purple-500/35 border border-purple-400/40 text-purple-200 font-semibold"
                            >
                              ✨ Ask Judge
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
          {activeTab === "chat" && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Left Column: Active Run Context & 1-Click Prompts */}
              <div className="lg:col-span-4 glass rounded-2xl p-5 space-y-4 flex flex-col justify-between">
                <div className="space-y-4">
                  <div className="flex items-center gap-3 p-3.5 rounded-2xl bg-slate-900/90 border border-purple-400/40">
                    <VenusAvatar size="lg" thinking={chatLoading} />
                    <div>
                      <div className="text-[11px] font-mono uppercase text-amber-300">Multi-Turn Quantum Copilot</div>
                      <h3 className="text-base font-bold text-white">Venus Quantum AI</h3>
                      <div className="text-[11px] text-emerald-400 font-mono">
                        {chatLoading ? `⚡ Synthesizing (${chatElapsed}s)...` : `Online • ${chatMessages.length} turns`}
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900/80 border border-purple-500/30 rounded-xl p-3.5 space-y-1.5 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold uppercase text-amber-300">📌 Active Run Context</span>
                      <span className="text-[10px] font-mono text-emerald-400">
                        Judge: {Math.round((audit.score || 0.96) * 100)}/100
                      </span>
                    </div>
                    <div className="text-xs font-semibold text-white truncate">"{lastExecutedPrompt}"</div>
                    <div className="text-[11px] text-purple-200 font-mono">
                      {result?.selected_algorithm || "VQE"} ({(telemetry.framework || framework).toUpperCase()}) • State |{execSummary.dominant_state || "01"}⟩ ({((execSummary.dominant_probability || 0) * 100).toFixed(1)}%)
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-400">
                      🌐 General Framework Q&A
                    </div>
                    {[
                      "What can the Venus Governed Quantum Agents framework do for an enterprise?",
                      "Explain Hardware Mode (Ideal Simulator vs. NISQ Noise) and Shots in simple words",
                      "Which quantum algorithms (VQE, QAOA, Grover, QSVM) and business use cases are supported?",
                      "How does the AI Governance & independent LLM-as-Judge architecture prevent hallucinations?"
                    ].map((q, i) => (
                      <button
                        key={i}
                        onClick={() => askCopilot(q)}
                        disabled={chatLoading}
                        className="w-full text-left px-3 py-2 rounded-xl text-xs glass-card hover:border-purple-400/60 text-slate-200 transition"
                      >
                        🌐 {q}
                      </button>
                    ))}
                  </div>

                  <div className="space-y-1.5">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-amber-300">
                      🔬 Analyze Last {result?.selected_algorithm || "Quantum"} Run
                    </div>
                    {[
                      `Explain in simple, normal words what state |${execSummary.dominant_state || "01"}⟩ at ${((execSummary.dominant_probability || 0) * 100).toFixed(1)}% means for this problem`,
                      `What do the variables (${(encoded.variables || ["var_1", "var_2"]).join(", ")}) mean and what business action should we take?`,
                      `Why did the independent LLM-as-Judge give this run ${Math.round((audit.score || 0.96) * 100)}/100 and what are the caveats?`
                    ].map((q, i) => (
                      <button
                        key={i}
                        onClick={() => askCopilot(q)}
                        disabled={chatLoading}
                        className="w-full text-left px-3 py-2 rounded-xl text-xs glass-card hover:border-amber-400/60 text-amber-100 transition"
                      >
                        ✨ {q}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={() => setChatMessages([chatMessages[0]])}
                  className="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 font-semibold transition"
                >
                  🗑️ Reset Multi-Turn Conversation
                </button>
              </div>

              {/* Right Column: Full-Height Multi-Turn Chat Stream */}
              <div className="lg:col-span-8 glass rounded-2xl p-5 flex flex-col h-[680px]">
                {/* Active Context Track Banner */}
                <div className="mb-3 p-2.5 rounded-xl bg-slate-900/90 border border-purple-500/30 flex flex-wrap items-center justify-between gap-2 text-xs">
                  <div className="flex items-center gap-2">
                    <span className="text-slate-400">Active Context Track:</span>
                    <span className="px-2.5 py-0.5 rounded-lg bg-purple-500/20 border border-purple-400/50 text-purple-200 font-bold">
                      {personaMode === "plain"
                        ? "1. 👤 Everyday Plain-Language Track (Deep Detail)"
                        : personaMode === "scientist"
                        ? "2. 🔬 Quantum Scientist Track (Deep Detail)"
                        : personaMode === "steps"
                        ? "3. 🧭 Step-by-Step Practical Guide Track (Deep Detail)"
                        : "🌍 All 3 Tracks (Click '+ Extend' or '🎯 Focus Track' on any card)"}
                    </span>
                  </div>
                  {personaMode !== "dual" && (
                    <button
                      onClick={() => setPersonaMode("dual")}
                      className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[11px] text-amber-300 font-semibold"
                    >
                      🔄 Show All 3 Tracks Again
                    </button>
                  )}
                </div>

                {/* Chat Messages Area */}
                <div ref={chatScrollRef} className="flex-1 bg-slate-950/75 border border-purple-500/20 rounded-xl p-4 overflow-y-auto space-y-4 scroll-smooth">
                {chatMessages.map((msg, i) => (
                  msg.role === "user" ? (
                    <div key={i} className="flex items-start justify-end gap-3">
                      <div className="max-w-xl rounded-2xl rounded-tr-sm bg-gradient-to-r from-cyan-600/40 to-blue-600/40 border border-cyan-400/50 p-3.5 text-xs text-white shadow">
                        <div className="text-[10px] font-mono uppercase text-cyan-300 mb-1">You (Quantum Architect / Executive)</div>
                        <div className="whitespace-pre-wrap leading-relaxed">{msg.content}</div>
                      </div>
                      <UserQuantumAvatar />
                    </div>
                  ) : (
                    <VenusTurnBubble
                      key={i}
                      msg={msg}
                      idx={i}
                      personaMode={personaMode}
                      onSelectContextTrack={selectAndContinueInTrack}
                      askCopilot={askCopilot}
                      disabled={chatLoading}
                    />
                  )
                ))}
                {chatLoading && (
                  <div className="flex items-start gap-3 animate-pulse">
                    <VenusAvatar size="md" thinking={true} />
                    <div className="glass-card rounded-2xl p-4 border border-cyan-400/50 space-y-1.5 max-w-lg">
                      <div className="flex items-center gap-2 text-xs font-mono text-amber-300">
                        <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping" />
                        <span>⚡ Venus Quantum AI ({model || "gemini-4-argon"}) is synthesizing response • ⏱️ {chatElapsed}s...</span>
                      </div>
                      <div className="text-[11px] text-slate-400">
                        Inspecting active quantum circuit, bitstring histogram & LLM-as-Judge telemetry (continues in background if you switch menus).
                      </div>
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

                {/* Chat Input Bar */}
                <div className="pt-3 mt-3 border-t border-purple-500/20 flex gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") askCopilot(chatInput); }}
                    placeholder="Ask a follow-up question about the quantum state, circuit gates, energy convergence, or governance audit..."
                    className="flex-1 bg-slate-900 border border-purple-500/30 focus:border-amber-400 rounded-xl px-4 py-2.5 text-sm text-white outline-none"
                  />
                  <button
                    onClick={() => askCopilot(chatInput)}
                    disabled={chatLoading || !chatInput.trim()}
                    className="px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm bg-gradient-to-r from-violet-500 via-purple-500 to-amber-400 text-slate-950 disabled:opacity-50"
                  >
                    {chatLoading ? `⏱️ ${chatElapsed}s...` : "Send Turn ➢"}
                  </button>
                </div>
              </div>
            </div>
          )}
          {activeTab === "quantum" && (
            <div className="space-y-5">
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Logical Qubits (n)</div>
                  <div className="text-xl font-bold text-cyan-400">{telemetry.num_qubits || 2} Qubits</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Circuit Depth (d)</div>
                  <div className="text-xl font-bold text-white">{telemetry.circuit_depth || 6} Layers</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">1Q / 2Q Entangling Gates</div>
                  <div className="text-xl font-bold text-emerald-400">
                    {gateCounts.single_qubit_gates || 4} / {gateCounts.two_qubit_gates || 2}
                  </div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Shannon Entropy (H)</div>
                  <div className="text-xl font-bold text-white">{execSummary.shannon_entropy_bits ?? 0.42} bits</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Optimizer / Precision</div>
                  <div className="text-xs font-bold text-cyan-300 truncate mt-1">{varMetrics.optimizer || "Optimal Quantum Oracle"}</div>
                </div>
                <div className="glass rounded-xl p-3.5">
                  <div className="text-[11px] text-slate-400">Noise Model</div>
                  <div className="text-xs font-bold text-amber-300 truncate mt-1">{telemetry.noise_model || "Ideal Simulator"}</div>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div className="glass rounded-2xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
                      Eigenstate Probability Distribution ({execSummary.repetitions || shots} Shots)
                    </h4>
                    <span className="text-xs font-mono text-slate-400">Peak: |{execSummary.dominant_state}⟩</span>
                  </div>
                  <div className="space-y-2.5 pt-1">
                    {bitstrings.map(([state, count]) => {
                      const pct = ((count / (execSummary.repetitions || shots)) * 100).toFixed(1);
                      return (
                        <div key={state} className="space-y-1">
                          <div className="flex justify-between text-xs font-mono">
                            <span className="text-cyan-300 font-bold">|{state}⟩</span>
                            <span className="text-slate-300">{count} shots ({pct}%)</span>
                          </div>
                          <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                            <div className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full" style={{ width: `${Math.max(2, pct)}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <ConvergenceChart
                  history={varMetrics.convergence_history || [-1.11, -1.52, -1.78, -1.857]}
                  metricName={varMetrics.metric_name}
                  unit={varMetrics.unit}
                />
              </div>
              <div className="glass rounded-2xl p-5 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex gap-2">
                    <button
                      onClick={() => setCodeTab("diagram")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${codeTab === "diagram" ? "bg-cyan-500 text-slate-950" : "glass-card text-slate-300"}`}
                    >
                      Synthesized Quantum Circuit Diagram
                    </button>
                    <button
                      onClick={() => setCodeTab("qasm")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${codeTab === "qasm" ? "bg-cyan-500 text-slate-950" : "glass-card text-slate-300"}`}
                    >
                      OpenQASM 2.0 Hardware IR
                    </button>
                  </div>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(codeTab === "diagram" ? (result?.circuit || "") : (telemetry.openqasm || ""));
                      setCopied(true);
                      setTimeout(() => setCopied(false), 1800);
                    }}
                    className="px-3 py-1 rounded-lg text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700"
                  >
                    {copied ? "✓ Copied" : "Copy Code"}
                  </button>
                </div>
                <pre className="bg-slate-950/90 border border-slate-800 rounded-xl p-4 text-xs font-mono text-cyan-300 overflow-x-auto leading-relaxed">
                  {codeTab === "diagram" ? (result?.circuit || "Synthesizing quantum circuit...") : (telemetry.openqasm || "OPENQASM 2.0;")}
                </pre>
              </div>
            </div>
          )}

          {activeTab === "memory" && (
            <div className="glass rounded-2xl p-5 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-cyan-400">
                  Persistent Audited Discovery Memory (Kubernetes PVC / Local Store)
                </h3>
                <span className="text-xs text-slate-400">{memoryList.length} Governance-Approved Records</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {memoryList.map((rec, idx) => (
                  <div key={idx} className="glass-card rounded-xl p-4 space-y-2 hover:border-cyan-500/40 transition">
                    <div className="flex items-center justify-between text-xs">
                      <span className="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold">
                        {rec.data?.algorithm_name || "Quantum"}
                      </span>
                      <span className="text-slate-400 font-mono text-[11px]">{rec.timestamp}</span>
                    </div>
                    <div className="text-sm font-semibold text-white">{rec.goal}</div>
                    <div className="text-xs text-slate-400 line-clamp-2">
                      {rec.data?.interpretation?.interpretation || "Verified quantum discovery record."}
                    </div>
                    <button
                      onClick={() => { setPrompt(rec.goal); setActiveTab("executive"); runDiscovery(rec.goal, framework); }}
                      className="text-xs text-cyan-400 hover:text-cyan-300 font-semibold pt-1"
                    >
                      ↻ Re-run this Discovery in Workbench →
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);







  </script>
</body>
</html>
