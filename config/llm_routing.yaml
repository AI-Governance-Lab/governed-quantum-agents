# config/llm_routing.yaml
agents:
  language_interface:
    primary:   "mistral/mistral-large-latest"
    fallback:  "openai/gpt-4o-mini"
    heavy:     "anthropic/claude-3-7-sonnet"

  planner:
    primary:   "mistral/mistral-large-latest"
    fallback:  "vertex_ai/gemini-2.5-pro"
    heavy:     "openai/gpt-4o"

  interpreter:
    primary:   "mistral/mistral-large-latest"
    fallback:  "gemini/gemini-1.5-flash"
    heavy:     "anthropic/claude-3-5-sonnet-latest"

  judge:
    primary:   "mistral/mistral-large-latest"
    fallback:  "groq/llama-3.3-70b-versatile" # Meta Llama 3.3
    heavy:     "openai/o1-preview"

  problem_encoder:
    primary:   "mistral/mistral-large-latest"
    fallback:  "anthropic/claude-3-5-haiku"

routing_rules:
  provider_preference: ["vertex_ai", "openai", "anthropic", "mistral", "groq", "vllm", "gemini"]
  max_cost_per_call_usd: 0.10
  fallback_on_timeout: true

