# config/llm_routing.yaml
# Routed via LiteLLM Coding & Discovery Gateway (litellm-agents :4001)
agents:
  language_interface:
    primary:   "gemini-4-argon"
    fallback:  "gemini-3.8-flash"
    heavy:     "glm-5.2"

  planner:
    primary:   "gemini-4-argon"
    fallback:  "gemini-3.8-flash"
    heavy:     "glm-5.2"

  problem_encoder:
    primary:   "gemini-4-argon"
    fallback:  "gemini-3.8-flash"
    heavy:     "codestral-2508"

  interpreter:
    primary:   "gemini-4-argon"
    fallback:  "gemini-3.8-flash"
    heavy:     "gemini-3.1-pro-preview"

  # Independent Model Family for LLM-as-Judge Governance (prevents self-audit bias)
  judge:
    primary:   "glm-5.2"
    fallback:  "gemini-4-argon"
    heavy:     "nvidia/nemotron-3-ultra-550b-a55b"

routing_rules:
  gateway: "litellm-agents"
  available_models:
    - "gemini-4-argon"
    - "gemini-3.8-flash"
    - "glm-5.2"
    - "gemini-3.1-pro-preview"
    - "codestral-2508"
    - "ministral-14b-latest"
    - "nvidia/nemotron-3-ultra-550b-a55b"
    - "nvidia/nemotron-3-super-120b-a12b"
    - "deepseek-ai/deepseek-v4-flash-0731"
  provider_preference: ["vertex_ai", "mistral", "nvidia", "openrouter"]
  max_cost_per_call_usd: 0.10
  fallback_on_timeout: true


