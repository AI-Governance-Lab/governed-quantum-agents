apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: governed-quantum-agents
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: governed-quantum-agents
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governed-quantum-agents
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: governed-quantum-agents
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: QUANTUM_API_BIND_IP
              value: {{ .Values.env.QUANTUM_API_BIND_IP | quote }}
            - name: QUANTUM_API_PORT
              value: {{ .Values.env.QUANTUM_API_PORT | quote }}
            - name: DISCOVERY_MEMORY_PATH
              value: {{ .Values.env.DISCOVERY_MEMORY_PATH | quote }}
            - name: LITELLM_BASE_URL
              value: {{ .Values.env.LITELLM_BASE_URL | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: LITELLM_MASTER_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: discovery-data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.persistence.hostSrcPath }}
            - name: app-src
              mountPath: /app/src
            {{- end }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: discovery-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.persistence.hostSrcPath }}
        - name: app-src
          hostPath:
            path: {{ .Values.persistence.hostSrcPath }}
            type: DirectoryOrCreate
        {{- end }}
      {{- end }}
